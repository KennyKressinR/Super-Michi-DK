const now=new Date(),at=(o=0)=>{const x=new Date(now);x.setDate(x.getDate()+o);x.setHours(A.hour,0,0,0);return x};let nx=at();if(nx<=now)nx=at(1);const N=[],F=c.flag,z=(d)=>({at:d,allowWhileIdle:true});
if(F.length)N.push({id:1000,title:F.length>1?`Se acaban ${F.length} productos muy vendidos`:`Se acaba ${F[0].p.n}`,body:F.length>1?`${F.slice(0,3).map(x=>x.p.n).join(', ')}${F.length>3?' y más':''}. Conviene comprar hoy.`:`${avwhen(F[0].cv)}. Vendes ~${+F[0].v.toFixed(1)} al día; compra unas ${F[0].nq}.`,schedule:z(nx)});
c.soon.slice(0,30).forEach((x,i)=>N.push({id:1001+i,title:`Pronto se acaba ${x.p.n}`,body:`Alcanza para ~${dd(Math.floor(x.cv))}. Prepara la compra.`,schedule:z(at(Math.max(1,Math.floor(x.cv-A.lead))))}));
if(N.length)await LN.schedule({notifications:N})}catch(e){}}
async function avTog(){const A=S.cfg.av,LN=PL('LocalNotifications');if(!A.on){if(NP()&&LN){try{const r=await LN.requestPermissions();if(r.display!='granted'){toast('Activa el permiso de notificaciones en el teléfono');return}}catch(e){toast('No se pudo pedir el permiso');return}}A.on=true}else A.on=false;save();avSched();go()}
async function avTest(){const LN=PL('LocalNotifications');if(NP()&&LN){try{const r=await LN.requestPermissions();if(r.display!='granted')return toast('Activa el permiso de notificaciones en el teléfono');await LN.schedule({notifications:[{id:998,title:'Aviso de prueba',body:'Así te avisa Súper Michi cuando se acaba un producto muy vendido.',schedule:{at:new Date(Date.now()+4000),allowWhileIdle:true}}]});toast('Te llegará en unos segundos')}catch(e){toast('No se pudo enviar el aviso')}}else toast('En el celular (APK) llegará como notificación')}
function avSet(k,d,mn,mx){const A=S.cfg.av;A[k]=Math.max(mn,Math.min(mx,A[k]+d));save();avSched();go()}
function vAv(){const c=avCalc(),A=c.A,row=(l,k,mn,mx,f)=>`<div class="r"><span>${l}</span><div class="st"><button onclick="avSet('${k}',-1,${mn},${mx})" aria-label="Menos">−</button><span class="n" style="min-width:70px">${f(A[k])}</span><button onclick="avSet('${k}',1,${mn},${mx})" aria-label="Más">+</button></div></div>`,left=A.days-c.days;
return`<h2>${ic('bell')}Avisos de stock</h2><div class="c l"><div class="r"><span class="pi"><span class="ci ac">${ic('bell')}</span><span>Avisarme cuando algo se acabe<small>${NP()?'Con notificaciones del celular':'Dentro de la app. En la APK llegan al celular'}</small></span></span><button class="sw2 ${A.on?'on':''}" aria-label="Activar avisos" onclick="avTog()"></button></div></div>${c.ok?'':`<div class="c"><div class="pi"><span class="ci ac">${ic('lock')}</span><div><b class="wrap">${c.days?`Empiezo a avisar en ${dd(left)}`:'Registra tus primeras ventas'}</b><small style="white-space:normal">Necesito ${dd(A.days)} de ventas para saber qué se vende más. Llevas ${c.days}.</small></div></div><div class="bar"><i style="width:${Math.min(100,c.days/A.days*100)}%"></i></div></div>`}
<h2>${ic('alert')}Se están acabando</h2><div class="c l">${c.flag.length?c.flag.map(x=>`<div class="r"><div class="pi" onclick="prodForm(prod('${x.p.id}'))">${pt(x.p)}<div><b class="wrap">${esc(x.p.n)}<span class="tag">${avwhen(x.cv)}</span></b><small style="white-space:normal">Vendes ~${+x.v.toFixed(1)} ${UL[x.p.u||'unidad']} al día. Compra unas ${x.nq}.</small></div></div><button class="b s" onclick="restock('${x.p.id}')">${ic('truck')}Comprar</button></div>`).join(''):empty(c.ok?'Todo en orden':'Aún sin análisis',c.ok?'Tus productos más vendidos tienen stock para varios días.':'Cuando pasen los días, aquí verás qué se acaba.')}</div>
${c.soon.length?`<h2>${ic('clock')}Próximos avisos</h2><div class="c l">${c.soon.slice(0,6).map(x=>`<div class="r"><div class="pi">${pt(x.p)}<div><b class="wrap">${esc(x.p.n)}</b><small style="white-space:normal">Alcanza para ~${dd(Math.floor(x.cv))}. Te aviso el ${new Date(Date.now()+Math.max(1,Math.floor(x.cv-A.lead))*864e5).toLocaleDateString('es',{day:'numeric',month:'short'})}.</small></div></div></div>`).join('')}</div>`:''}
<h2>${ic('sliders')}Cómo avisar</h2><div class="c l">${row('Empezar después de','days',1,30,dd)}${row('Avisar con antelación de','lead',1,14,dd)}${row('Hora del aviso','hour',6,21,v=>v+':00')}</div><div class="c"><small>Productos más vendidos a vigilar</small><div class="chips" style="margin-top:8px">${[5,10,20].map(n=>`<button class="${A.top==n?'on':''}" onclick="avSet('top',${n}-S.cfg.av.top,5,20)">Top ${n}</button>`).join('')}</div></div><div class="row"><button class="b g" onclick="avTest()">${ic('bell')}Probar aviso</button></div>`}
let CX={e:'',done:false};
const dsep=()=>(1.5).toLocaleString(CU[S.cfg.cur].l).replace(/\d/g,''),cfmt=n=>(+n.toFixed(8)).toLocaleString(CU[S.cfg.cur].l,{maximumFractionDigits:8}),cfx=e=>e.replace(/\*/g,'×').replace(/\//g,'÷').replace(/-/g,'−').replace(/\./g,dsep());
function cev(s){const t=s.match(/\d*\.?\d+|[+\-*/%]/g)||[];let i=0;const fa=()=>{if(t[i]=='-'){i++;return-fa()}const n=parseFloat(t[i++]);if(isNaN(n))throw 0;if(t[i]=='%'){i++;return n/100}return n},te=()=>{let v=fa();while(t[i]=='*'||t[i]=='/'){const o=t[i++],r=fa();if(o=='/'&&r==0)throw 0;v=o=='*'?v*r:v/r}return v},ex=()=>{let v=te();while(t[i]=='+'||t[i]=='-'){const o=t[i++],j=i;let r=te();if(i-j==2&&t[i-1]=='%')r*=v;v=o=='+'?v+r:v-r}return v};const v=ex();if(i<t.length)throw 0;return v}
function cres(e){try{const s=e.replace(/[+\-*/]+$/,'');if(!s||s=='-')return null;const r=cev(s);return Number.isFinite(r)?r:null}catch(x){return null}}
function kp(k){let e=CX.e;const ops='+-*/';if(k=='='&&CX.done)return;if(CX.done&&(/\d/.test(k)||k=='.'))e='';
if(k=='ac')e='';else if(k=='del')e=e.slice(0,-1);
else if(k=='='){const r=cres(e);if(r==null)return;S.calcH.unshift([e,r]);S.calcH=S.calcH.slice(0,20);save();CX.e=String(+r.toFixed(8));CX.done=true;go();return}
else if(ops.includes(k)){if(!e){if(k=='-')e='-'}else if(e!='-'){e=ops.includes(e.slice(-1))?e.slice(0,-1)+k:e+k}}
else if(k=='%'){if(/\d$/.test(e))e+='%'}
else if(k=='.'){const l=e.split(/[+\-*/%]/).pop();if(!l.includes('.'))e+=l===''?'0.':'.'}
else{if(e.slice(-1)=='%')e+='*';e+=k}
CX.e=e;CX.done=false;cup()}
function cup(){const e=CX.e,r=cres(e),op=/[+\-*/%]/.test(e.slice(1)),v=r!=null&&r>0?+r.toFixed(CU[S.cfg.cur].d):0;
$('#cx').textContent=op?cfx(e):CX.done&&S.calcH[0]?cfx(S.calcH[0][0])+' =':'';$('#cv').textContent=op||CX.done?(r==null?'':cfmt(r)):cfx(e)||'0';
$('#ca').innerHTML=v?`<button class="b g s" onclick="freeSale(${v})">${ic('cart')}Cobrar monto</button><button class="b g s" onclick="expense(${v})">${ic('wallet')}Registrar gasto</button>`:''}
function cuse(i){CX.e=String(+S.calcH[i][1].toFixed(8));CX.done=true;cup();scrollTo(0,0)}
const vCalc=()=>{const K=[['ac','AC','fn','Borrar todo'],['del',ic('backspace'),'fn','Borrar'],['%',ic('percent'),'fn','Porcentaje'],['/',ic('divide'),'op','Dividir'],['7','7'],['8','8'],['9','9'],['*',ic('times'),'op','Multiplicar'],['4','4'],['5','5'],['6','6'],['-',ic('minus'),'op','Restar'],['1','1'],['2','2'],['3','3'],['+',ic('plus'),'op','Sumar'],['0','0','z'],['.',dsep(),'','Decimal'],['=',ic('equals'),'eq','Igual']];
return`<h2>${ic('calc')}Calculadora</h2><div class="c cd"><div class="ce" id="cx"></div><div class="cr n" id="cv">0</div><div class="ca" id="ca"></div></div><div class="kp">${K.map(k=>`<button class="k ${k[2]||''}" onclick="kp('${k[0]}')" aria-label="${k[3]||k[1]}">${k[1]}</button>`).join('')}</div>${S.calcH.length?`<h2>${ic('clock')}Historial</h2><div class="c l">${S.calcH.slice(0,6).map((h,i)=>`<div class="r" onclick="cuse(${i})"><b class="n" style="font-weight:500">${cfx(h[0])}</b><b class="n">= ${cfmt(h[1])}</b></div>`).join('')}</div><div class="row"><button class="b g s" onclick="S.calcH=[];save();go()">${ic('trash')}Borrar historial</button></div>`:''}`};
document.addEventListener('keydown',e=>{if(tab!='calc'||e.ctrlKey||e.metaKey||e.target.closest('input,dialog,textarea'))return;const m={Enter:'=','=':'=',Backspace:'del',Escape:'ac',',':'.'},k=m[e.key]||(/^[0-9.+\-*/%]$/.test(e.key)?e.key:null);if(k){e.preventDefault();kp(k)}});
const F={ventas:['Nueva venta',saleOv],prod:['Nuevo producto',()=>prodForm()],rep:['Registrar gasto',expense]};
$('#fab').onclick=()=>F[tab][1]();
$('#sp').innerHTML=Object.entries(I).map(([k,v])=>`<symbol id="i-${k}" viewBox="0 0 24 24">${v}</symbol>`).join('');
function go(){const c=S.cfg;document.body.classList.toggle('cat',c.cat);accent();
$('#nm').textContent=c.name;$('#dt').textContent=(c.who?'Hola, '+c.who+'. ':'')+new Date().toLocaleDateString('es',{weekday:'long',day:'numeric',month:'long'});
$('#av').innerHTML=c.logo?`<img src="${c.logo}" alt="">`:'<svg aria-hidden="true"><use href="#cat"/></svg>';$('#eye').innerHTML=ic(c.hide?'eyeoff':'eye');
$('#app').innerHTML={home:vHome,ventas:vVentas,prod:vProd,rep:vRep,set:vSet,calc:vCalc,av:vAv}[tab]();if(tab=='calc')cup();
const nb=avCalc().flag.length;$('#nav').innerHTML=TB.map(t=>`<button class="${tab==t[0]?'on':''}" onclick="tab='${t[0]}';q='';cf='Todas';go();scrollTo(0,0)">${ic(t[2])}${t[1]}${t[0]=='av'&&nb?`<i class="nb">${nb}</i>`:''}</button>`).join('');
const f=$('#fab');f.hidden=!F[tab];if(F[tab])f.innerHTML=ic('plus')+F[tab][0];
$('#sup').innerHTML=[...new Set([...S.tx.map(t=>t.sup),...S.prods.map(p=>p.sup)].filter(Boolean))].map(s=>`<option value="${esc(s)}">`).join('')}
go();avD();
</script></body></html>
